xt><text x="110" y="565" font-size="24" font-weight="700">HC-SR501 PIR</text><text x="105" y="610" font-size="17">VCC • OUT • GND</text><text x="1060" y="215" font-size="24" font-weight="700">SSD1306 OLED</text><text x="1060" y="255" font-size="17">SDA GPIO21</text><text x="1060" y="290" font-size="17">SCL GPIO22</text><text x="1060" y="325" font-size="17">3.3V • GND</text><text x="1060" y="520" font-size="24" font-weight="700">N-MOSFET</text><text x="1060" y="560" font-size="17">Gate GPIO25</text><text x="1060" y="595" font-size="17">Source → GND</text><text x="1060" y="630" font-size="17">Drain → lamp −</text><text x="1115" y="765" font-size="20">5V LED</text><text x="60" y="885" font-size="17" fill="#9fb0c8">Common ground. Lamp uses regulated 5V. Do not drive lamp load directly from ESP32 GPIO.</text></g></svg>